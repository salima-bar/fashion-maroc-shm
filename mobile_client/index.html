<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <title>FASHION MAROC — Mobile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <!-- En-tête application -->
    <header class="app-header">
        <div class="d-flex align-items-center justify-content-between">
            <div>
                <h1 class="app-title mb-0">FASHION MAROC</h1>
                <p class="app-subtitle mb-0">Livreurs &amp; gérants</p>
            </div>
            <button type="button" class="btn btn-refresh" id="btnRefresh" aria-label="Actualiser">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>
    </header>

    <!-- Zone de contenu principale -->
    <main class="app-main">

        <!-- Message d'erreur connexion -->
        <div id="errorBanner" class="alert alert-danger d-none mx-3 mt-2" role="alert">
            <i class="bi bi-wifi-off me-2"></i>
            <span id="errorMessage">Impossible de joindre le serveur.</span>
        </div>

        <!-- Indicateur de chargement -->
        <div id="loadingSpinner" class="loading-overlay d-none">
            <div class="spinner-border text-warning" role="status">
                <span class="visually-hidden">Chargement…</span>
            </div>
            <p class="mt-2 text-muted small">Connexion au serveur…</p>
        </div>

        <!-- Onglet Catalogue -->
        <section id="panelCatalogue" class="tab-panel active">
            <div class="section-header">
                <h2><i class="bi bi-grid me-2"></i>Catalogue</h2>
                <span class="badge bg-primary rounded-pill" id="badgeCatalogue">0</span>
            </div>
            <div id="catalogueList" class="product-list">
                <!-- Cartes produits injectées par app.js -->
            </div>
            <div id="catalogueEmpty" class="empty-state d-none">
                <i class="bi bi-inbox"></i>
                <p>Aucun produit disponible.</p>
            </div>
        </section>

        <!-- Onglet Alertes -->
        <section id="panelAlertes" class="tab-panel d-none">
            <div class="section-header alert-header">
                <h2><i class="bi bi-exclamation-triangle me-2"></i>Alertes stock</h2>
                <span class="badge bg-danger rounded-pill" id="badgeAlertes">0</span>
            </div>
            <div id="alertesList" class="alert-list">
                <!-- Liste alertes injectée par app.js -->
            </div>
            <div id="alertesEmpty" class="empty-state success-state d-none">
                <i class="bi bi-check-circle"></i>
                <p>Aucune alerte — stock sous contrôle.</p>
            </div>
        </section>

        <!-- Onglet Commandes -->
        <section id="panelCommandes" class="tab-panel d-none">
            <div class="section-header">
                <h2><i class="bi bi-truck me-2"></i>Commandes</h2>
                <span class="badge bg-secondary rounded-pill" id="badgeCommandes">0</span>
            </div>
            <div id="commandesList" class="commande-list"></div>
            <div id="commandesEmpty" class="empty-state d-none">
                <i class="bi bi-clipboard-x"></i>
                <p>Aucune commande fournisseur.</p>
            </div>
        </section>

        <!-- Onglet Stats -->
        <section id="panelStats" class="tab-panel d-none">
            <div class="section-header">
                <h2><i class="bi bi-bar-chart-fill me-2"></i>Statistiques</h2>
            </div>
            <div id="statsGrid" class="stats-grid"></div>
            <div id="statsEmpty" class="empty-state d-none">
                <i class="bi bi-graph-down"></i>
                <p>Statistiques indisponibles.</p>
            </div>
        </section>

    </main>

    <!-- Barre de navigation basse (Bottom Nav) -->
    <nav class="bottom-nav" role="navigation" aria-label="Navigation principale">
        <button type="button" class="nav-item active" data-tab="catalogue" id="navCatalogue">
            <i class="bi bi-grid-fill"></i>
            <span>Catalogue</span>
        </button>
        <button type="button" class="nav-item" data-tab="alertes" id="navAlertes">
            <i class="bi bi-bell-fill"></i>
            <span>Alertes</span>
            <span class="nav-badge d-none" id="navAlertBadge">0</span>
        </button>
        <button type="button" class="nav-item" data-tab="commandes" id="navCommandes">
            <i class="bi bi-truck"></i>
            <span>Commandes</span>
        </button>
        <button type="button" class="nav-item" data-tab="stats" id="navStats">
            <i class="bi bi-bar-chart-fill"></i>
            <span>Stats</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
